<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound + BGM Generator</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css"></head>
<body><header class="app-header"><div class="app-header__inner"><h1 class="app-title">🎵 Sound + BGM Generator</h1><div id="status" class="status-badge">状態を確認中…</div></div></header>
<main class="app-main"><section class="panel"><h2 class="panel__title">音を作る</h2>
<div class="tabs"><button id="mode-sfx" class="btn btn--secondary">効果音 · small-sfx</button><button id="mode-music" class="btn btn--secondary">BGM · small-music</button></div>
<p id="mode-help">効果音: 既定5秒。選んだモデルだけをロードします。</p><p id="translator" class="advanced-settings__hint"></p>
<div id="music-presets" class="preset-grid"></div>
<textarea id="prompt" class="custom-form__textarea" rows="3" placeholder="例: 重い鉄の扉がゆっくり開く音 / 幻想的な森を探索する静かなBGM"></textarea>
<label class="field-label">長さ <span id="duration-label">5</span> 秒 <input id="duration" type="range" min="0.5" max="30" step="0.5" value="5" class="slider"></label>
<input id="name" class="text-input" placeholder="名前（空欄なら自動命名）"><details class="advanced-settings"><summary>詳細設定</summary><input id="seed" class="text-input" type="number" min="0" placeholder="seed（任意）"></details>
<button id="generate" class="btn btn--primary btn--wide">生成する</button><p id="message"></p></section>
<section class="panel"><h2 class="panel__title">生成履歴（再生・保存）</h2><p>▶ で再生、保存で WAV をダウンロードできます。翻訳した英語プロンプトも表示します。</p><div id="history"></div></section></main><footer class="app-footer">モデルごとに Hugging Face のゲート承認・ライセンス同意が必要です。<a href="https://stability.ai" target="_blank" rel="noopener">Powered by Stability AI</a></footer><script src="/static/app.js"></script></body></html>
